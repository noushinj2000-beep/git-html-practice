<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کره زمین سفید تعاملی</title>
    <style>
        body {
            margin: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #canvas-container {
            width: 600px;
            height: 600px;
            max-width: 90vw;
            max-height: 90vh;
            cursor: grab;
        }
        #canvas-container:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const container = document.getElementById('canvas-container');
        const width = container.clientWidth || 600;
        const height = container.clientHeight || 600;

        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.z = 2.8;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;
        controls.enablePan = false;
        controls.minDistance = 1.8;
        controls.maxDistance = 6.0;

        // نورپردازی
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.6);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);

        // نقشه زمین
        const textureLoader = new THREE.TextureLoader();
        const earthMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');

        // افزایش شعاع کره به 1.1 برای بزرگ‌تر شدن
        const geometry = new THREE.SphereGeometry(1.1, 64, 64);
        const material = new THREE.MeshStandardMaterial({
            map: earthMap,
            roughness: 0.6,
            metalness: 0.1
        });

        const globe = new THREE.Mesh(geometry, material);
        scene.add(globe);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>

</body>
</html>
